<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradLife" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e3a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="umbrellaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glowLife" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGradLife)"/>

  <!-- Radial Light Spot -->
  <circle cx="400" cy="200" r="220" fill="#3b82f6" opacity="0.3" filter="url(#glowLife)"/>

  <!-- Umbrella / Protective Canopy -->
  <g transform="translate(400, 160)">
    <!-- Umbrella Canopy Top -->
    <path d="M -150 20 C -150 -90 150 -90 150 20 C 100 0 50 10 0 0 C -50 10 -100 0 -150 20 Z" fill="url(#umbrellaGrad)" stroke="#ffffff" stroke-width="4"/>
    <!-- Umbrella Spine & Handle -->
    <line x1="0" y1="-95" x2="0" y2="100" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M 0 100 C 0 130 -30 130 -30 110" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Family Silhouette Under Canopy -->
  <g transform="translate(400, 290)">
    <!-- Father -->
    <circle cx="-55" cy="-60" r="14" fill="#ffffff"/>
    <path d="M -75 -40 C -75 -40 -55 -45 -35 -40 L -40 25 L -70 25 Z" fill="#ffffff" rx="8"/>

    <!-- Mother -->
    <circle cx="-15" cy="-55" r="13" fill="#e0f2fe"/>
    <path d="M -32 -36 C -32 -36 -15 -40 2 -36 L -2 25 L -28 25 Z" fill="#e0f2fe"/>

    <!-- Child 1 -->
    <circle cx="25" cy="-35" r="10" fill="#93c5fd"/>
    <path d="M 12 -20 C 12 -20 25 -24 38 -20 L 35 25 L 15 25 Z" fill="#93c5fd"/>

    <!-- Child 2 / Pet -->
    <circle cx="58" cy="-25" r="8" fill="#bae6fd"/>
    <path d="M 48 -12 C 48 -12 58 -15 68 -12 L 65 25 L 51 25 Z" fill="#bae6fd"/>
  </g>

  <!-- Financial Security Elements -->
  <!-- Left Card: US Term & Estate -->
  <g transform="translate(130, 225)">
    <rect x="-85" y="-50" width="170" height="100" rx="14" fill="#ffffff" opacity="0.95"/>
    <text x="0" y="-18" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#0f2b48" text-anchor="middle">🇺🇸 US Term Life</text>
    <text x="0" y="5" font-family="'Inter', Arial, sans-serif" font-weight="700" font-size="15" fill="#2563eb" text-anchor="middle">$500k – $2M</text>
    <text x="0" y="24" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="10" fill="#64748b" text-anchor="middle">Income Replacement</text>
    <text x="0" y="38" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="10" fill="#64748b" text-anchor="middle">&amp; Mortgage Buffer</text>
  </g>

  <!-- Right Card: UK Level & Trust -->
  <g transform="translate(670, 225)">
    <rect x="-85" y="-50" width="170" height="100" rx="14" fill="#ffffff" opacity="0.95"/>
    <text x="0" y="-18" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#0f2b48" text-anchor="middle">🇬🇧 UK Level Term</text>
    <text x="0" y="5" font-family="'Inter', Arial, sans-serif" font-weight="700" font-size="15" fill="#e11d48" text-anchor="middle">£250k – £1M</text>
    <text x="0" y="24" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="10" fill="#64748b" text-anchor="middle">Written in Trust</text>
    <text x="0" y="38" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="10" fill="#64748b" text-anchor="middle">40% IHT Protection</text>
  </g>

  <!-- Title Bottom Ribbon -->
  <rect x="220" y="380" width="360" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.2)"/>
  <text x="400" y="407" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="1">TERM &amp; WHOLE LIFE GUIDE 2025</text>
</svg>
