<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradProp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glowProp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGradProp)"/>

  <!-- Protective Dome / Shield Arc -->
  <path d="M 180 320 C 180 120 620 120 620 320" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="400" cy="120" r="14" fill="#38bdf8" filter="url(#glowProp)"/>

  <!-- Architectural House Silhouette -->
  <g transform="translate(400, 240)">
    <!-- House Base Shadow -->
    <ellipse cx="0" cy="95" rx="140" ry="18" fill="#000000" opacity="0.3"/>

    <!-- Main House Body -->
    <rect x="-100" y="-20" width="200" height="110" rx="8" fill="#ffffff"/>

    <!-- Roof -->
    <polygon points="0,-100 -125,-20 125,-20" fill="url(#roofGrad)"/>
    <polygon points="0,-100 -125,-20 0,-20" fill="#2563eb" opacity="0.3"/>

    <!-- Chimney -->
    <rect x="50" y="-80" width="22" height="40" fill="#1e3a8a"/>

    <!-- Door -->
    <rect x="-22" y="25" width="44" height="65" rx="4" fill="#1e293b"/>
    <circle cx="12" cy="58" r="3" fill="#fbbf24"/>

    <!-- Windows Left -->
    <rect x="-80" y="0" width="38" height="38" rx="4" fill="#dbeafe"/>
    <line x1="-61" y1="0" x2="-61" y2="38" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="-80" y1="19" x2="-42" y2="19" stroke="#1e3a8a" stroke-width="2"/>

    <!-- Windows Right -->
    <rect x="42" y="0" width="38" height="38" rx="4" fill="#dbeafe"/>
    <line x1="61" y1="0" x2="61" y2="38" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="42" y1="19" x2="80" y2="19" stroke="#1e3a8a" stroke-width="2"/>

    <!-- Key & Lock Safety Overlay -->
    <circle cx="0" cy="-20" r="28" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
    <path d="M -8 -15 Q 0 -26 8 -15 V -8 H -8 Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-12" r="3" fill="#ffffff"/>
  </g>

  <!-- Left: US Hazard & Flood Box -->
  <g transform="translate(130, 225)">
    <rect x="-85" y="-50" width="170" height="100" rx="14" fill="#ffffff" opacity="0.95"/>
    <text x="0" y="-18" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#0f2b48" text-anchor="middle">🇺🇸 US Hazard &amp; NFIP</text>
    <text x="0" y="5" font-family="'Inter', Arial, sans-serif" font-weight="700" font-size="15" fill="#2563eb" text-anchor="middle">HO-3 &amp; HO-5</text>
    <text x="0" y="24" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="10" fill="#64748b" text-anchor="middle">Dwelling Replacement</text>
    <text x="0" y="38" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="10" fill="#64748b" text-anchor="middle">&amp; Escrow Mandates</text>
  </g>

  <!-- Right: UK Buildings & Contents Box -->
  <g transform="translate(670, 225)">
    <rect x="-85" y="-50" width="170" height="100" rx="14" fill="#ffffff" opacity="0.95"/>
    <text x="0" y="-18" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="13" fill="#0f2b48" text-anchor="middle">🇬🇧 UK Buildings/Contents</text>
    <text x="0" y="5" font-family="'Inter', Arial, sans-serif" font-weight="700" font-size="15" fill="#e11d48" text-anchor="middle">Rebuild Cost Index</text>
    <text x="0" y="24" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="10" fill="#64748b" text-anchor="middle">Subsidence, Flood Re</text>
    <text x="0" y="38" font-family="'Inter', Arial, sans-serif" font-weight="500" font-size="10" fill="#64748b" text-anchor="middle">&amp; Accidental Cover</text>
  </g>

  <!-- Title Bottom Ribbon -->
  <rect x="220" y="380" width="360" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.2)"/>
  <text x="400" y="407" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="1">PROPERTY &amp; HOMEOWNERS 2025</text>
</svg>
